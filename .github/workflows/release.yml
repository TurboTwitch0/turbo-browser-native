name: Release Windows browser

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve and verify release version
        id: version
        shell: pwsh
        run: |
          $releaseVersion = node -p "require('./package.json').version"
          $releaseTag = "v$releaseVersion"
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne $releaseTag) {
            throw 'The pushed release tag must match package.json.'
          }
          "tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test browser core
        run: npm test
      - name: Exercise the embedded Chromium browser
        run: npm run smoke
      - name: Package single-file Windows browser
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $releaseExecutables = Get-ChildItem -LiteralPath artifacts -Filter 'Turbo-Browser-*-win-x64.exe'
          if ($releaseExecutables.Count -eq 0) { throw 'The portable Windows executable was not produced.' }
          $releaseChecksums = foreach ($releaseExecutable in $releaseExecutables) {
            $releaseHash = Get-FileHash -LiteralPath $releaseExecutable.FullName -Algorithm SHA256
            "$($releaseHash.Hash.ToLowerInvariant())  $($releaseExecutable.Name)"
          }
          $releaseChecksums | Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Retain release files
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-Browser-release
          path: |
            artifacts/Turbo-Browser-*-win-x64.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/Turbo-Browser-*-win-x64.exe
            artifacts/SHA256SUMS.txt
          body: |
            Download Turbo-Browser-0.2.0-win-x64.exe and open it to launch Turbo's own Chromium browser.
            No ZIP extraction, setup wizard, or administrator installation is required.
            The download page cannot run software automatically; you open the downloaded file yourself.
            This build is unsigned and does not include an automatic updater.
            SHA256SUMS.txt contains the checksum for the portable executable.
