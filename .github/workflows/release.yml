name: Release Windows browser

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release TurboBrowser ')))
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve and verify release version
        id: version
        shell: pwsh
        run: |
          $releaseVersion = node -p "require('./package.json').version"
          $releaseTag = "v$releaseVersion"
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF_NAME -ne $releaseTag) {
            throw 'The pushed release tag must match package.json.'
          }
          "tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test browser core
        run: npm test
      - name: Smoke-test the source app with embedded Chromium
        run: npm run smoke
      - name: Package the per-user Windows installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $releaseInstaller = Get-Item -LiteralPath artifacts/TurboBrowser.exe
          $releaseHash = Get-FileHash -LiteralPath $releaseInstaller.FullName -Algorithm SHA256
          "$($releaseHash.Hash.ToLowerInvariant())  TurboBrowser.exe" | Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Retain release files
        uses: actions/upload-artifact@v4
        with:
          name: TurboBrowser-release
          path: |
            artifacts/TurboBrowser.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/TurboBrowser.exe
            artifacts/SHA256SUMS.txt
          body: |
            Download TurboBrowser.exe and open it once to install for your Windows user. The browser opens when installation finishes.
            After that, launch TurboBrowser from its desktop or Start menu shortcut. The installed app avoids unpacking a portable bundle on every launch.
            No ZIP extraction, multi-step setup wizard, or administrator installation is required.
            The download page cannot run software automatically; you open the downloaded file yourself.
            This build is unsigned and does not include an automatic updater.
            SHA256SUMS.txt contains the checksum for TurboBrowser.exe.
            Optional Tor private tabs use the bundled Tor network client; regular and ordinary private tabs connect directly.
            Tor can be slower, your network can see Tor use, and this Chromium app does not provide Tor Browser's full anonymity protections.
            Automated smoke tests exercise the source application; they do not run the packaged installer.
